[pytest]
markers =
    e2e: Playwright browser end-to-end tests (slow; needs chromium)
    e2e_layout(name): which tests.e2e.fixtures_fs.layout_* to materialize
    e2e_fixture_delay_ms(ms): slow fixture lookups so Cancel is clickable
addopts = -ra -m "not e2e"
filterwarnings =
    ignore::DeprecationWarning
